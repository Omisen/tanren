# Workspace Rust del progetto.
#
# - `crates/core`  il cuore del dominio, indipendente da Tauri e dalla UI.
# - `src-tauri`    la shell che espone il core al frontend e produce gli eseguibili.
#
# Il core sta fuori da src-tauri di proposito: deve poter essere compilato e
# testato senza avviare Tauri, e restare riusabile se un domani nascesse una
# superficie nativa diversa.

[workspace]
members = ["crates/core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Omisen"]

[workspace.dependencies]
tanren-core = { path = "crates/core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rand = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"
unicode-normalization = "0.1.25"
log = "0.4"
