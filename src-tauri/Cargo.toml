[package]
name = "tanren-app"
description = "Tauri shell for Tanren: exposes the domain core to the frontend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
# Il nome della libreria e' usato da main.rs su desktop e dal punto di ingresso
# mobile generato da Tauri.
name = "tanren_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Il dominio vive qui dentro: questa crate si limita a esporlo.
tanren-core = { workspace = true }

tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
chrono = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
